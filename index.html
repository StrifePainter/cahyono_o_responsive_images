<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <title>Assignment 3 - Responsive Image Sizing</title>
</head>
    <body>
        <header>
            <section class="grid-con center-grid-con">
                <h1 class="col-span-full">Responsive Image Examples (Featuring Fribbit and Onyx)</h1>
            </section>
        </header>
    
    <main class="grid-con center-grid-con">
        <section class="col-span-full">
            <h2>Picture Tag</h2>
            <picture>
                <source srcset="images/training-sesh-1-1200.png" media="(min-width:1200px)">
                <source srcset="images/training-sesh-1-768.png" media="(min-width:768px)">
                <img src="images/training-sesh-1-300.png" alt="Two monks practicing punches">
            </picture>
        </section>

        <section class="col-span-full">
            <h2>Img tag and srcset attributes</h2>
            <img sizes="(max-width: 1200px) 100vw, 1200px"
            srcset="
            images/training-sesh-2-1200_pe1cxc_c_scale,w_200.png 200w,
            images/training-sesh-2-1200_pe1cxc_c_scale,w_493.png 493w,
            images/training-sesh-2-1200_pe1cxc_c_scale,w_698.png 698w,
            images/training-sesh-2-1200_pe1cxc_c_scale,w_870.png 870w,
            images/training-sesh-2-1200_pe1cxc_c_scale,w_1024.png 1024w,
            images/training-sesh-2-1200_pe1cxc_c_scale,w_1163.png 1163w,
            images/training-sesh-2-1200_pe1cxc_c_scale,w_1200.png 1200w"
            src="images/training-sesh-2-1200_pe1cxc_c_scale,w_1200.png"
            alt="Onyx carries a giant rock while Fribbit sits on top of the giant rock and lifts a slightly tinier rock">
        </section>


        <section class="col-span-full">
            <h2>Background Attribute in CSS</h2>
            <div id="bg-image"></div>
         </section>

    </main>
    
    <footer class="grid-con center-grid-con" id="footer">
        <h2 class="visually-hidden">Footer</h2>
            <p class="col-span-full">©StrifePainter 2026</p>
    </footer>
    
    <script src="js/script.js"></script>
</body>
</html>
